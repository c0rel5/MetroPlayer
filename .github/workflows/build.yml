name: Build APK
on:
  push:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Build debug APK
        run: gradle assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: MetroPlayer-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(grep -m1 'versionName' app/build.gradle.kts | sed -E 's/.*"([^"]+)".*/\1/')
          TAG="build-${{ github.run_number }}"
          APK="MetroPlayer-v${VERSION}-build${{ github.run_number }}.apk"
          cp app/build/outputs/apk/debug/app-debug.apk "$APK"
          {
            cat RELEASE_NOTES.md
            echo
            echo '> Google services may flag this APK as a virus. Please check it on [VirusTotal](https://www.virustotal.com/) ¯\\\_(ツ)\_/¯'
            echo
            echo "---"
            echo "Build ${{ github.run_number }} · commit ${GITHUB_SHA::7}"
          } > release_body.md
          # a re-run of the same workflow run reuses the tag, so remove an old release first
          gh release delete "$TAG" --yes --cleanup-tag 2>/dev/null || true
          gh release create "$TAG" "$APK" \
            --target "${{ github.sha }}" \
            --title "Metro Player ${VERSION} (build ${{ github.run_number }})" \
            --notes-file release_body.md \
            --latest
